<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neovim / WezTerm Cheatsheet</title>
<style>
  :root {
    --bg: #1F1F28;
    --bg2: #16161D;
    --card: #2A2A37;
    --line: #363646;
    --fg: #DCD7BA;
    --dim: #9a9890;
    --key: #FF9E3B;
    --key-bg: #2d2a1f;
    --accent: #7E9CD8;
    --green: #98BB6C;
    --violet: #957FB8;
    --red: #E46876;
    --mark: #6A9589;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body {
    font-family: "JetBrains Mono", "Noto Sans JP", ui-monospace, Menlo, monospace;
    font-size: 13px;
    line-height: 1.45;
    padding: 0 16px 48px;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: linear-gradient(var(--bg) 85%, rgba(31,31,40,0));
    padding: 14px 0 12px;
    display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center;
  }
  header h1 { font-size: 16px; margin: 0; letter-spacing: .04em; }
  header h1 span { color: var(--dim); font-weight: normal; }
  #q {
    flex: 1 1 260px; max-width: 520px;
    background: var(--bg2); color: var(--fg);
    border: 1px solid var(--line); border-radius: 6px;
    padding: 8px 12px; font: inherit; outline: none;
  }
  #q:focus { border-color: var(--accent); }
  .tabs { display: flex; gap: 6px; }
  .tab {
    border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px;
    cursor: pointer; color: var(--dim); background: var(--bg2); user-select: none;
  }
  .tab.on { color: var(--bg2); background: var(--key); border-color: var(--key); font-weight: 600; }
  .legend { color: var(--dim); font-size: 12px; }
  .legend b { color: var(--key); font-weight: 600; }
  #count { color: var(--dim); font-size: 12px; }

  .part { margin-top: 10px; }
  .part > h2 {
    font-size: 13px; color: var(--accent); margin: 18px 0 8px;
    text-transform: uppercase; letter-spacing: .12em;
    border-bottom: 1px solid var(--line); padding-bottom: 4px;
  }
  .note {
    color: var(--dim); font-size: 12px; margin: 0 0 10px;
  }
  .note b { color: var(--fg); font-weight: 600; }
  .grid {
    display: grid; gap: 10px;
    grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
    align-items: start;
  }
  .sec {
    background: var(--card); border: 1px solid var(--line); border-radius: 8px;
    padding: 8px 10px 6px; break-inside: avoid;
  }
  .sec h3 {
    margin: 0 0 6px; font-size: 12.5px; color: var(--green);
    display: flex; justify-content: space-between; align-items: baseline;
  }
  .sec h3 small { color: var(--dim); font-weight: normal; font-size: 11px; }
  .sec p.tip { color: var(--dim); font-size: 11.5px; margin: 0 0 6px; }
  table { width: 100%; border-collapse: collapse; }
  td { padding: 2.5px 4px; vertical-align: top; border-top: 1px solid rgba(255,255,255,.04); }
  tr:first-child td { border-top: 0; }
  td.k { width: 44%; white-space: nowrap; }
  kbd {
    display: inline-block; padding: 0 5px; margin: 1px 2px 1px 0;
    border-radius: 4px; background: var(--key-bg); color: var(--key);
    border: 1px solid #4a4030; font: inherit; font-size: 12px; line-height: 1.5;
  }
  kbd.mode { background: transparent; border-color: var(--line); color: var(--violet); font-size: 10.5px; }
  td.d { color: var(--fg); }
  td.d em { color: var(--dim); font-style: normal; }
  mark { background: var(--mark); color: var(--bg2); border-radius: 2px; padding: 0 1px; }
  .hidden { display: none !important; }
  .empty { color: var(--dim); padding: 24px 0; }
  @media print {
    body { background: #fff; color: #111; font-size: 10.5px; }
    header, .tabs, #q, .legend, #count { display: none; }
    .sec { background: #fff; border-color: #ccc; }
    kbd { background: #f3f0e6; color: #7a4a00; border-color: #d9d2bf; }
    .sec h3 { color: #2d6a1f; } .part > h2 { color: #2b4a8a; }
  }
</style>
</head>
<body>
<header>
  <h1>Cheatsheet <span>Neovim + WezTerm</span></h1>
  <input id="q" type="search" placeholder="検索 (/ でフォーカス, Esc でクリア)  例: leader r, pane, test, 定義" autocomplete="off">
  <div class="tabs">
    <div class="tab on" data-part="all">すべて</div>
    <div class="tab" data-part="nvim">Neovim</div>
    <div class="tab" data-part="wez">WezTerm</div>
  </div>
  <div class="legend">Neovim <b>&lt;leader&gt;</b> = Space　/　WezTerm <b>LEADER</b> = Ctrl-q (2秒)　/　<b>⌘</b> = Cmd</div>
  <div id="count"></div>
</header>

<div id="root"></div>
<div id="empty" class="empty hidden">一致する項目はありません。</div>

    ["右", "アクティブな key table (赤) / CPU 負荷 / メモリ / バッテリー / 日時"],
    ["タブ", "アクティブは黄色。閉じるボタン・追加ボタンなし"],
  ]},
  { name: "見た目・挙動", items: [
    ["フォント", "JetBrains Mono Medium 11pt (日本語は Noto Sans JP)"],
    ["配色", "Kanagawa (Gogh)。Neovim も Kanagawa wave + 透過"],
    ["透過", "フォーカス時 95% / 非フォーカス時 80%、ブラー 20"],
    ["非アクティブペイン", "暗く・彩度を下げて表示"],
    ["IME", "有効。未確定文字は WezTerm 側で描画。Ctrl/Alt は IME に渡さない"],
    ["送信先", "Neovim の <leader>rs / <leader>ap は Herdr 内の Claude ペイン (同じタブ優先) → WezTerm ペインの順で候補を出し、複数あれば選択"],
  ]},
];

// ---------------------------------------------------------------------------
// render
// ---------------------------------------------------------------------------
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function keyHtml(k) {
  // split alternatives on " / " but keep "/ " and "? " literal keys intact
  const parts = k.split(/ \/ (?=\S)/);
  return parts.map(p => `<kbd>${esc(p)}</kbd>`).join('<span style="color:var(--dim)"> / </span>');
}

function render(list, partId, title, note) {
  const secs = list.map(sec => {
    const rows = sec.items.map(([k, d, m]) => {
      const mode = m ? ` <kbd class="mode">${esc(m)}</kbd>` : "";
      return `<tr data-text="${esc((sec.name + " " + k + " " + d + " " + (m || "")).toLowerCase())}">
        <td class="k">${keyHtml(k)}${mode}</td><td class="d">${esc(d)}</td></tr>`;
    }).join("");
    const tip = sec.tip ? `<p class="tip">${esc(sec.tip)}</p>` : "";
    return `<section class="sec" data-name="${esc(sec.name.toLowerCase())}">
      <h3>${esc(sec.name)}<small>${sec.items.length}</small></h3>${tip}<table>${rows}</table></section>`;
  }).join("");
  return `<div class="part" data-part="${partId}"><h2>${title}</h2><p class="note">${note}</p><div class="grid">${secs}</div></div>`;
}

document.getElementById("root").innerHTML =
  render(NVIM, "nvim", "Neovim",
    "<b>&lt;leader&gt;</b> = Space。設定: ~/.config/nvim (lazy.nvim)。タグ n/v/i/t はモード (未記載はノーマル)。") +
  render(WEZ, "wez", "WezTerm",
    "<b>LEADER</b> = Ctrl-q (2 秒)。設定: ~/.config/wezterm/wezterm.lua + keybinds.lua。<b>⌘</b> = Cmd (SUPER)。");

// ---------------------------------------------------------------------------
// search + tabs
// ---------------------------------------------------------------------------
const q = document.getElementById("q");
const count = document.getElementById("count");
let part = "all";

function norm(s) {
  return s.toLowerCase()
    .replace(/<leader>|leader\s*/g, "<leader>")   // "leader r" → "<leader>r"
    .replace(/\s+/g, " ").trim();
}

function highlight(cell, terms) {
  const txt = cell.textContent;
  let html = esc(txt);
  for (const t of terms) {
    if (!t) continue;
    const re = new RegExp(t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi");
    html = html.replace(re, m => `\u0000${m}\u0001`);
  }
  cell.innerHTML = html.replace(/\u0000/g, "<mark>").replace(/\u0001/g, "</mark>");
}

function apply() {
  const raw = norm(q.value);
  const terms = raw.split(" ").filter(Boolean);
  let shown = 0;
  document.querySelectorAll(".part").forEach(p => {
    const partOn = part === "all" || p.dataset.part === part;
    p.classList.toggle("hidden", !partOn);
    if (!partOn) return;
    p.querySelectorAll(".sec").forEach(sec => {
      let any = 0;
      sec.querySelectorAll("tr").forEach(tr => {
        const text = tr.dataset.text.replace(/leader\s*/g, "<leader>");
        const hit = terms.every(t => text.includes(t));
        tr.classList.toggle("hidden", !hit);
        const d = tr.querySelector("td.d");
        if (hit) { any++; highlight(d, terms.length && q.value.trim() ? terms : []); }
      });
      sec.classList.toggle("hidden", any === 0);
      shown += any;
    });
  });
  document.getElementById("empty").classList.toggle("hidden", shown > 0);
  count.textContent = `${shown} 項目`;
}

q.addEventListener("input", apply);
document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => {
  document.querySelectorAll(".tab").forEach(x => x.classList.remove("on"));
  t.classList.add("on"); part = t.dataset.part; apply();
}));
document.addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement !== q) { e.preventDefault(); q.focus(); q.select(); }
  if (e.key === "Escape") { q.value = ""; apply(); q.blur(); }
});
apply();
</script>
